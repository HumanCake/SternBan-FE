<div *ngIf="!selectedBoard">
  <h2>All Boards</h2>
  <ul>
    <li *ngFor="let board of boards" (click)="selectBoard(board.boardId)">
      {{ board.boardId}}
    </li>
  </ul>
</div>

<div *ngIf="selectedBoard">
  <div>boardId: {{ selectedBoard.boardId }}</div>
  <app-board
    [board]="selectedBoard"
    (addColumnEmitter)="addColumn($event)"
    (boardEmitter)="updateBoard($event)"
    (boardUpdatedEmitter)="updateBoard($event)">
  </app-board>
</div>
