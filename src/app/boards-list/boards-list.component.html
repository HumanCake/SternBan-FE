@if (boards.length > 0) {
  <div>
    <h2>All Boards</h2>
    <ul>
      @for (board of boards; track board) {
        <li (click)="selectBoard(board.boardId)">
          {{board.title}}
        </li>
      }
    </ul>
  </div>
}

@if (boards.length === 0) {
  <div>
    <p>No boards available.</p>
  </div>
}
