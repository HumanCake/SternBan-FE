<div
  (cdkDropListDropped)="drop($event)"
  [cdkDropListConnectedTo]="connectedTo"
  [cdkDropListData]="column?.tickets"
  cdkDropList
  cdkDropListElementContainer
  class="column-content"
  >
  <h2>{{ column?.title }}</h2>
  @for (ticket of column?.tickets; track ticket) {
    <div cdkDrag>
      <app-ticket (ticketUpdatedEmitter)="ticketUpdated()"
        [ticket]="ticket">
      </app-ticket>
    </div>
  }
</div>
