<div class ticket-dialog-wrapper>
  <button class="close-button" (click)="closeDialog()"> X </button >
<div class="ticket-dialog-header">
  <h1 mat-dialog-title class="dialog-title"><b>{{ticket.title}}</b></h1>

  <!-- The menu button -->
  <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-button">
    ☰
  </button>
  <!-- The dropdown menu -->
  <mat-menu #menu="matMenu" yPosition="below" xPosition="before">
    <button mat-menu-item (click)="Delete()">Delete ticket</button>
  </mat-menu>

</div>
  <textarea class="description-edit" [(ngModel)]="localDescription"></textarea>
  <button class="save-button" (click)="saveDescription()">Save</button>
</div>
